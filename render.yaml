services:
  # ─── Backend: FastAPI + Uvicorn ───────────────────────────────────────────
  - type: web
    name: codeguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AGENT_TIMEOUT_SECONDS
        value: "45"
      - key: PIPELINE_TIMEOUT_SECONDS
        value: "120"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: ANALYZER_TIMEOUT_SECONDS
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      # CORS_ORIGINS: exact production frontend origin + localhost for local dev
      # This tells the backend which browser origins are allowed to call it.
      - key: CORS_ORIGINS
        value: "https://codeguard-frontend-kb89.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      # GEMINI_API_KEY must be set manually in Render dashboard (not stored here for security)

  # ─── Frontend: Vite React SPA ─────────────────────────────────────────────
  - type: web
    name: codeguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      # VITE_API_URL: points the frontend at the production backend
      # Vite bakes this into the static bundle at build time.
      - key: VITE_API_URL
        value: "https://codeguard-backend-nku6.onrender.com"

